<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Como priorizo os testes? | Lucas Camargo</title>
    <meta
      name="description"
      content="Como priorizo testes de API e interface com base em risco, impacto e probabilidade."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    data-title-key="testPrioritization.pageTitle"
    data-description-key="testPrioritization.pageDescription"
  >
    <div class="page-shell">
      <header class="topbar subpage-topbar">
        <a
          class="brand"
          href="index.html"
          aria-label="Portfólio de Lucas Camargo"
          data-i18n-aria-label="testCases.brandLabel"
        >
          <span class="brand-name">lucas</span><span class="brand-tag">@qa</span>
        </a>

        <div
          class="nav-actions subpage-actions"
          aria-label="Ações do site"
          data-i18n-aria-label="accessibility.siteActions"
        >
          <div
            class="lang-switch"
            aria-label="Selecionar idioma"
            data-i18n-aria-label="accessibility.languageSelector"
          >
            <button class="lang-btn active" data-lang="pt" type="button">PT</button>
            <button class="lang-btn" data-lang="en" type="button">EN</button>
          </div>
          <a
            class="secondary-btn"
            href="index.html#projects"
            data-i18n="testPrioritization.back"
          ></a>
        </div>
      </header>

      <main>
        <section class="hero subpage-hero">
          <div class="hero-content">
            <div class="hero-copy">
              <span class="eyebrow" data-i18n="testPrioritization.eyebrow"></span>
              <h1 data-i18n="testPrioritization.title"></h1>
              <p data-i18n="testPrioritization.description"></p>
              <nav
                class="skills-list"
                aria-label="Seções da página"
                data-i18n-aria-label="testPrioritization.sections"
              >
                <a href="#api" data-i18n="testPrioritization.api"></a>
                <a href="#interface" data-i18n="testPrioritization.interface"></a>
              </nav>
            </div>
          </div>
        </section>

        <section class="section" aria-labelledby="prioritization-framework-title">
          <div class="section-head">
            <span class="eyebrow" data-i18n="testPrioritization.eyebrow"></span>
            <h2 id="prioritization-framework-title" data-i18n="testPrioritization.frameworkTitle"></h2>
            <p data-i18n="testPrioritization.frameworkIntro"></p>
          </div>

          <h3 class="prioritization-subtitle" data-i18n="testPrioritization.scaleTitle"></h3>
          <div class="priority-level-grid">
            <article class="priority-level priority-p0">
              <h4 data-i18n="testPrioritization.p0Title"></h4>
              <p data-i18n="testPrioritization.p0Body"></p>
            </article>
            <article class="priority-level priority-p1">
              <h4 data-i18n="testPrioritization.p1Title"></h4>
              <p data-i18n="testPrioritization.p1Body"></p>
            </article>
            <article class="priority-level priority-p2">
              <h4 data-i18n="testPrioritization.p2Title"></h4>
              <p data-i18n="testPrioritization.p2Body"></p>
            </article>
            <article class="priority-level priority-p3">
              <h4 data-i18n="testPrioritization.p3Title"></h4>
              <p data-i18n="testPrioritization.p3Body"></p>
            </article>
          </div>

          <h3 class="prioritization-subtitle" data-i18n="testPrioritization.orderTitle"></h3>
          <ol class="prioritization-steps">
            <li data-i18n="testPrioritization.order1"></li>
            <li data-i18n="testPrioritization.order2"></li>
            <li data-i18n="testPrioritization.order3"></li>
            <li data-i18n="testPrioritization.order4"></li>
          </ol>
        </section>

        <section class="section prioritization-section" id="api">
          <div class="section-head">
            <span class="eyebrow" data-i18n="testPrioritization.api"></span>
            <h2 data-i18n="testPrioritization.apiHeading"></h2>
            <p data-i18n="testPrioritization.apiIntro"></p>
          </div>
          <a
            class="primary-btn"
            href="https://serverest.dev/?lang=en#/"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="testPrioritization.openApi"
          ></a>
          <h3 class="prioritization-subtitle" data-i18n="testPrioritization.apiExamplesTitle"></h3>
          <div class="prioritization-example-grid">
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p0">P0</span>
              <h4 data-i18n="testPrioritization.apiCase1Title"></h4>
              <p data-i18n="testPrioritization.apiCase1Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p0">P0</span>
              <h4 data-i18n="testPrioritization.apiCase2Title"></h4>
              <p data-i18n="testPrioritization.apiCase2Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p1">P1</span>
              <h4 data-i18n="testPrioritization.apiCase3Title"></h4>
              <p data-i18n="testPrioritization.apiCase3Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p1">P1</span>
              <h4 data-i18n="testPrioritization.apiCase4Title"></h4>
              <p data-i18n="testPrioritization.apiCase4Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p2">P2</span>
              <h4 data-i18n="testPrioritization.apiCase5Title"></h4>
              <p data-i18n="testPrioritization.apiCase5Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p2">P2/P3</span>
              <h4 data-i18n="testPrioritization.apiCase6Title"></h4>
              <p data-i18n="testPrioritization.apiCase6Body"></p>
            </article>
          </div>
        </section>

        <section class="section prioritization-section" id="interface">
          <div class="section-head">
            <span class="eyebrow" data-i18n="testPrioritization.interface"></span>
            <h2 data-i18n="testPrioritization.interfaceHeading"></h2>
            <p data-i18n="testPrioritization.interfaceIntro"></p>
          </div>
          <a
            class="primary-btn"
            href="https://front.serverest.dev/login"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="testPrioritization.openInterface"
          ></a>
          <h3 class="prioritization-subtitle" data-i18n="testPrioritization.interfaceExamplesTitle"></h3>
          <div class="prioritization-example-grid">
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p0">P0</span>
              <h4 data-i18n="testPrioritization.uiCase1Title"></h4>
              <p data-i18n="testPrioritization.uiCase1Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p0">P0</span>
              <h4 data-i18n="testPrioritization.uiCase2Title"></h4>
              <p data-i18n="testPrioritization.uiCase2Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p1">P1</span>
              <h4 data-i18n="testPrioritization.uiCase3Title"></h4>
              <p data-i18n="testPrioritization.uiCase3Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p1">P1</span>
              <h4 data-i18n="testPrioritization.uiCase4Title"></h4>
              <p data-i18n="testPrioritization.uiCase4Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p2">P1/P2</span>
              <h4 data-i18n="testPrioritization.uiCase5Title"></h4>
              <p data-i18n="testPrioritization.uiCase5Body"></p>
            </article>
            <article class="prioritization-example">
              <span class="priority-tag priority-tag-p3">P2/P3</span>
              <h4 data-i18n="testPrioritization.uiCase6Title"></h4>
              <p data-i18n="testPrioritization.uiCase6Body"></p>
            </article>
          </div>
        </section>

        <aside class="prioritization-note" role="note" data-i18n="testPrioritization.safetyNote"></aside>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
